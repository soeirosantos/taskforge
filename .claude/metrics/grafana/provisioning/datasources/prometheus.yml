apiVersion: 1

# deleteDatasources clears the pre-existing entry first, so adding a fixed uid
# to a datasource Grafana already provisioned does not fail with
# "data source not found" on startup.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  # uid is fixed so provisioned dashboards can reference it by name.
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true