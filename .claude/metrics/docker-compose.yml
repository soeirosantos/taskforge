services:
  # Receives OTLP pushes from short-lived `claude -p` processes and holds the
  # metrics so Prometheus has something stable to scrape. Claude Code exits too
  # quickly to be scraped directly, and concurrent workers would collide on a
  # single exporter port.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: claude-otel-collector
    restart: unless-stopped

    ports:
      # OTLP/HTTP — the endpoint Claude Code pushes to.
      - "127.0.0.1:4318:4318"
      # OTLP/gRPC — unused by Claude Code, exposed for convenience.
      - "127.0.0.1:4317:4317"

    volumes:
      - ./otel-collector/config.yml:/etc/otelcol-contrib/config.yaml:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: claude-prometheus
    restart: unless-stopped

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"

    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:latest
    container_name: claude-grafana
    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

    environment:
      # safe - local-only credentials
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"

    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data: