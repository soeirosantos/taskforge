# TaskForge deterministic completion gate configuration.
#
# Set TEST_COMMAND to the command that runs the repository's complete unit-test
# suite. The command must exit non-zero when verification fails.
#
# An empty TEST_COMMAND fails closed: TaskCompleted will refuse to close tasks
# until verification is configured.
#
# Examples:
#   TEST_COMMAND="go test ./..."
#   TEST_COMMAND="cargo test"
#   TEST_COMMAND="pytest"
#   TEST_COMMAND="npm test"

TEST_COMMAND=""

# Wall-clock limit for TEST_COMMAND. Keep this below the TaskCompleted hook
# timeout in .claude/settings.json, or increase that hook timeout as well.
TEST_TIMEOUT_SECONDS=300
