# Per-branch configuration for the TaskCompleted verification gate.
#
# This is the ONLY file that should differ between experiment branches. It is
# sourced by verify-unit-tests.sh, which stays byte-for-byte identical across
# every branch so that all arms of the experiment run the same apparatus.
#
# Shell syntax. Assignments only — this file is sourced, so anything you put
# here executes inside the gate.

# TEST_COMMAND
#   The command that runs the COMPLETE unit-test suite for this branch.
#   It must exit non-zero when any unit test fails.
#
#   Empty means the gate FAILS CLOSED: every task-completion attempt is refused.
#   That is the correct state for `main`, which holds no application code.
#
#   Set this on each experiment branch, e.g.:
#     TEST_COMMAND="go test ./..."      # experiment/go
#     TEST_COMMAND="cargo test"         # experiment/rust
TEST_COMMAND="go test ./..."

# TEST_TIMEOUT_SECONDS
#   Wall-clock limit for the suite. Exceeding it terminates the test process
#   tree and refuses completion.
#
#   300 is a conservative placeholder, not a measured value. Once a branch has a
#   real suite, time a cold run and set this to roughly 3x that. Keep it below
#   the hook `timeout` in .claude/settings.json (currently 360) so that this
#   script, not the Claude Code hook handler, enforces the limit.
TEST_TIMEOUT_SECONDS=300
