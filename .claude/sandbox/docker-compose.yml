# Sandbox service for autonomous experiment runs.
#
# Usage:
#   export CLAUDE_CODE_OAUTH_TOKEN=<token>          # from `claude setup-token`
#   cd .claude/metrics && docker compose up -d      # start the metrics stack
#   cd ../sandbox && docker compose run --rm sandbox
#
# Joins the metrics stack's network so Claude Code can push OTLP to the
# collector by service name. Start the metrics stack first: this network is
# declared external, so compose will not create it.

services:
  sandbox:
    build:
      context: .
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    image: taskforge-sandbox:latest
    container_name: taskforge-sandbox

    # The repository, and nothing else from the host. This is what makes
    # --dangerously-skip-permissions defensible: full authority inside a
    # directory that is fully recoverable from git.
    volumes:
      - ../../:/work:rw

    working_dir: /work

    environment:
      # Auth. Passed from your shell; never baked into the image or committed.
      # Generate the token on the host with `claude setup-token`.
      #
      # Defaults to empty rather than being required, because run-arm.sh already
      # checks for it and fails with actionable guidance. Requiring it here would
      # produce a less useful compose error instead.
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"

      # Reach the collector by service name on the shared network. The host's
      # localhost:4318 is not reachable from inside a container.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"

      # Identify this arm. run-arm.sh sets this; the default here only applies
      # if you start a shell manually.
      OTEL_RESOURCE_ATTRIBUTES: "${OTEL_RESOURCE_ATTRIBUTES:-experiment.arm=unset,apparatus.sha=unset}"

      # Required for INTERACTIVE sessions to have TaskCreate/TaskUpdate.
      #
      # The tool gate has several escape hatches; headless `claude -p` takes an
      # unconditional one, so `-p` probes always show the tools present while an
      # interactive session on the same build does not. Interactive sessions
      # fall through to a server-side A/B flag that is off by default, and this
      # variable is the supported override. Note CLAUDE_CODE_ENABLE_TASKS is a
      # different, unrelated switch and does not control this.
      #
      # Must be the string "true" — the check is a strict boolean comparison.
      CLAUDE_CODE_ENABLE_TODO_TOOLS: "true"

    networks:
      - metrics

    # Keep an interactive shell usable for `docker compose run`.
    stdin_open: true
    tty: true

networks:
  metrics:
    external: true
    name: metrics_default
